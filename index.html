<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Songo Master - Graines Réseau</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="lobby-container">
        <div class="lobby-box">
            <h2>Songo Réseau 237</h2>
            <p id="status-message">Connexion au serveur Cloud en cours...</p>
            
            <div class="input-group">
                <input type="text" id="room-code" placeholder="Nom du salon..." disabled>
            </div>

            <div class="actions">
                <button id="btn-create" disabled>Créer salon</button>
                <button id="btn-connect" disabled>Rejoindre</button>
            </div>
        </div>
    </div>

    <div id="game-container">
        <header>
            <h1>SONGO NETWORK</h1>
            <div id="role-badge">En attente...</div>
            <div id="turn-indicator">Tour : --</div>
        </header>

        <main class="board-wrapper">
            <div class="score-board">
                <div class="score">Nord (Adversaire) : <span id="score-nord">0</span></div>
                <div class="score">Sud (Moi) : <span id="score-sud">0</span></div>
            </div>

            <div class="songo-board">
                <div class="row row-nord">
                    <div class="pit" data-index="7"></div>
                    <div class="pit" data-index="8"></div>
                    <div class="pit" data-index="9"></div>
                    <div class="pit" data-index="10"></div>
                    <div class="pit" data-index="11"></div>
                    <div class="pit" data-index="12"></div>
                    <div class="pit" data-index="13"></div>
                </div>
                <div class="row row-sud">
                    <div class="pit" data-index="6"></div>
                    <div class="pit" data-index="5"></div>
                    <div class="pit" data-index="4"></div>
                    <div class="pit" data-index="3"></div>
                    <div class="pit" data-index="2"></div>
                    <div class="pit" data-index="1"></div>
                    <div class="pit" data-index="0"></div>
                </div>
            </div>
        </main>

        <footer>
            <div id="move-log">Connectez-vous pour commencer.</div>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
